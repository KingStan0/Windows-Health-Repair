name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: PSScriptAnalyzer (Error severity)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path 'Repair-WindowsHealth.ps1' -Severity Error -Recurse
          if ($results) {
            $results | Format-List RuleName, Severity, Message, ScriptName, Line
            throw "$($results.Count) error-severity violation(s) found."
          }
          Write-Host "No error-severity violations."

  test:
    name: Pester tests + PS 5.1 parse check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse check under Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'Repair-WindowsHealth.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw "Syntax errors found in Repair-WindowsHealth.ps1"
          }
          Write-Host "Parse OK under PowerShell 5.1"
      - name: Install Pester 5
        shell: pwsh
        run: Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck -MinimumVersion 5.0
      - name: Run Pester tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0
          $result = Invoke-Pester -Path 'tests' -PassThru
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) test(s) failed." }
          Write-Host "$($result.TotalCount) tests passed."
