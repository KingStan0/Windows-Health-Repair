name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: PSScriptAnalyzer (Error severity)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path 'Repair-WindowsHealthUtility.ps1' -Severity Error -Recurse
          if ($results) {
            $results | Format-List RuleName, Severity, Message, ScriptName, Line
            throw "$($results.Count) error-severity violation(s) found."
          }
          Write-Host "No error-severity violations."

  test:
    name: Pester tests + PS 5.1 parse check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse check under Windows PowerShell 5.1
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE 'Repair-WindowsHealthUtility.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw "Syntax errors found in Repair-WindowsHealthUtility.ps1"
          }
          Write-Host "Parse OK under PowerShell 5.1"
      - name: ASCII and BOM check
        shell: pwsh
        run: |
          $b=[System.IO.File]::ReadAllBytes((Join-Path $env:GITHUB_WORKSPACE 'Repair-WindowsHealthUtility.ps1'))
          $n=@($b | Where-Object { $_ -gt 127 }).Count
          if ($n -gt 0) { throw "Non-ASCII bytes found: $n" }
          if ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) { throw "BOM detected" }
          Write-Host "ASCII OK, no BOM"
      - name: Validate example JSON
        shell: pwsh
        run: |
          $j=Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'WindowsHealthRepair.example.json') -Raw | ConvertFrom-Json
          if (-not $j) { throw "example.json is not valid JSON" }
          Write-Host "example.json valid"
          $b2=[System.IO.File]::ReadAllBytes((Join-Path $env:GITHUB_WORKSPACE 'WindowsHealthRepair.example.json'))
          $n2=@($b2 | Where-Object { $_ -gt 127 }).Count
          if ($n2 -gt 0) { throw "Non-ASCII in example.json" }
          Write-Host "example.json ASCII OK"
      - name: Install Pester 5
        shell: pwsh
        run: Install-Module Pester -Force -Scope CurrentUser -SkipPublisherCheck -MinimumVersion 5.0
      - name: Run Pester tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0
          $result = Invoke-Pester -Path 'tests' -PassThru
          if ($result.FailedCount -gt 0) { throw "$($result.FailedCount) test(s) failed." }
          Write-Host "$($result.TotalCount) tests passed."
